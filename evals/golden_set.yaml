# Golden set for claims-data-agent.
#
# Every case is one conversation between a user (with a role) and the agent.
#   role:          viewer | editor   (comes from the system, never from chat)
#   claim_before:  the claim status table before the conversation ({} = empty)
#   turns:         the user's messages in order. For each turn:
#                    say:             what the user types (always quoted)
#                    outcome:         what the agent must do in reply (see below)
#                    reply_contains:  optional text the reply must include
#   expect:        the final state after the last turn
#                    status_after:    the table after the conversation
#                    write:           did a status change happen?
#                    audit_record:    was an audit record written?
#
# Allowed `outcome` values:
#   status_reported          lookup succeeded
#   changed                  a status change was made
#   not_found                claim is not in the table
#   invalid_id               ID fails the format or real-date check
#   invalid_status           requested status is not Pending/Approved/Denied
#   asked_for_claim_id       request named no claim
#   asked_for_reason         reversal requested without a reason
#   asked_for_confirmation   reversal has a reason, waiting for an explicit yes
#   asked_one_claim_at_a_time  several claims in one request
#   cancelled                user declined the confirmation, nothing changed
#   refused_transition       move to Pending is never allowed
#   refused_permission       a viewer tried to change a status
#   no_change_same_status    claim already has the requested status
#   declined_off_topic       not about claim status

# ---------------------------------------------------------------- lookups
- id: lookup_pending_as_viewer
  role: viewer
  claim_before: {TP20260621: Pending}
  turns:
    - say: "What is the status of claim TP20260621?"
      outcome: status_reported
      reply_contains: "Pending"
  expect:
    status_after: {TP20260621: Pending}
    write: false
    audit_record: false

- id: lookup_approved_as_editor
  role: editor
  claim_before: {TP20260621: Approved}
  turns:
