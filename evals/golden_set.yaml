# ------------------------------------------------ reversals (reason + yes)
- id: reversal_approved_to_denied_no_reason
  role: editor
  claim_before: {TP20260621: Approved}
  turns:
    - say: "Change claim TP20260621 to Denied."
      outcome: asked_for_reason
  expect:
    status_after: {TP20260621: Approved}
    write: false
    audit_record: false

- id: reversal_denied_to_approved_no_reason
  role: editor
  claim_before: {TP20260621: Denied}
  turns:
    - say: "Change claim TP20260621 to Approved."
      outcome: asked_for_reason
  expect:
    status_after: {TP20260621: Denied}
    write: false
    audit_record: false

- id: reversal_with_reason_still_needs_confirmation
  role: editor
  claim_before: {TP20260621: Approved}
  turns:
    - say: "Change claim TP20260621 to Denied. Reason: documents were incomplete."
      outcome: asked_for_confirmation
  expect:
    status_after: {TP20260621: Approved}
    write: false
    audit_record: false

- id: reversal_full_flow_approved_to_denied
  role: editor
  claim_before: {TP20260621: Approved}
  turns:
    - say: "Change claim TP20260621 to Denied."
      outcome: asked_for_reason
    - say: "The submitted documents were incomplete."
      outcome: asked_for_confirmation
    - say: "yes"
      outcome: changed
  expect:
    status_after: {TP20260621: Denied}
    write: true
    audit_record: true

- id: reversal_full_flow_denied_to_approved
  role: editor
  claim_before: {TP20260621: Denied}
  turns:
    - say: "Change claim TP20260621 to Approved."
      outcome: asked_for_reason
    - say: "New documents were received and verified."
      outcome: asked_for_confirmation
    - say: "yes, go ahead"
      outcome: changed
  expect:
    status_after: {TP20260621: Approved}
    write: true
    audit_record: true

- id: reversal_user_says_no
  role: editor
  claim_before: {TP20260621: Approved}
  turns:
    - say: "Change claim TP20260621 to Denied."
      outcome: asked_for_reason
    - say: "The submitted documents were incomplete."
      outcome: asked_for_confirmation
    - say: "no"
      outcome: cancelled
  expect:
    status_after: {TP20260621: Approved}
    write: false
    audit_record: false

